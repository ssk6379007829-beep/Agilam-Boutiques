<!doctype html>
<!-- en-IN, not en: the catalogue is priced in rupees, sized to Indian
     measurements and delivered in India. It tells a search engine which market
     this belongs to. The edge middleware rewrites this per request too. -->
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6F2" />
<!--
  The title and description here are the fallback only. Every real page gets its
  own, written server-side by `middleware.ts` before the HTML is sent (which is
  what non-JavaScript crawlers and link-preview bots read) and kept in step
  during client-side navigation by `usePageMeta`.

  The marker comments are load-bearing. The edge REPLACES this block rather than
  adding to it: it emits its own description/robots/author/geo tags, and with
  the block left in place every crawled page shipped two `description` and two
  `geo.region` tags — leaving Google free to pick the generic fallback over the
  page's real copy. `headFor()` in middleware.js must keep emitting every tag
  named between these markers.
-->
<title>MangaiMart</title>
<!-- ag:shell-meta:start -->
<meta name="description" content="Shop verified independent boutiques across India in one place — sarees, kurta sets, kurtis and more, with direct chat to the shop." />
<meta name="author" content="MangaiMart" />
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
<!-- Geo signal at country level. This was IN-TN, which pinned the whole
     marketplace to one state; the per-boutique ClothingStore nodes still carry
     the real city, which is what wins "boutiques in <city>". -->
<meta name="geo.region" content="IN" />
<meta name="geo.placename" content="India" />
<!-- ag:shell-meta:end -->
<!-- ── Icons ────────────────────────────────────────────────────────────────
     Cut from `Fav no BG.png` — the mark alone. The previous icon was
     `icon-500.png`, the full lockup including the "MangaiMart" wordmark; at the
     16–32 px a tab actually renders, that type is an unreadable pink smudge.

     `favicon.ico` carries 16/32/48 and exists as a real file for a second
     reason: `vercel.json` rewrites everything that isn't a static file to `/`,
     so a request for `/favicon.ico` — which Google's favicon crawler, feed
     readers and older browsers make regardless of what this markup says — was
     being answered with the HTML of the home page. It is transparent, so it
     sits on the browser's own tab colour in both light and dark chrome.

     Both are tiny (≈7 kB and ≈2 kB). A favicon is requested on every cold load
     and shares the connection with the JavaScript bundle and the LCP image, so
     weight here is taken directly from what the page is waiting on — which is
     why the 983 kB `favicon.png` and the 110 kB `icon-500.png` are no longer
     referenced. Both files stay on disk: older bookmarks and already-cached
     manifests still point at them. -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
<!-- iOS ignores the manifest for the home-screen icon and composites any
     transparency onto black, so this one is pre-flattened onto the brand ground. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Resolve the theme before first paint so there's never a wrong-theme flash.
     A saved choice wins; otherwise follow the device's prefers-color-scheme. -->
<script>try{var p=localStorage.getItem('ag-theme-pref');var t=(p==='light'||p==='dark')?p:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name=theme-color]').setAttribute('content','#120A0E');}}catch(e){}</script>
<!-- ── Fonts ────────────────────────────────────────────────────────────────
     A `<link rel="stylesheet">` in the head is render-blocking: the browser
     will not paint until it has fetched the CSS *and* the font files it names.
     On the 3G connections most of this marketplace's shoppers are on, these
     three stylesheets were adding roughly 400–900 ms to first paint, in front
     of a splash screen that exists precisely to avoid making people wait.

     They are now loaded asynchronously with the `media="print"` swap: the
     browser fetches them at low priority without blocking the render, and the
     `onload` promotes them to `all` the instant they arrive. `<noscript>` keeps
     the plain blocking version for anything that can't run the swap.

     Fraunces replaced Playfair Display as the display face (`--ag-display` in
     index.css, which is where the reasoning lives). It is asked for as a
     VARIABLE font on `opsz` as well as `wght`: Fraunces carries a real optical
     size axis, browsers drive it from the font-size for free under the default
     `font-optical-sizing: auto`, and that axis is the reason it was chosen —
     naming static weights would fetch several files and throw away the thing
     that makes one token work at both 18px and 52px.

     Italic is requested, but only just: exactly two places set it (a receipt
     sign-off and a boutique bio line), both small and both regular weight. The
     note that stood here said the design "only ever sets italic on already-bold
     display type" and dropped italic 500/600 on that basis — it was describing
     the opposite of what the code does, and Playfair's italic 700 was the one
     italic weight being fetched that nothing rendered. The variable range
     covers every weight either style actually uses, so there is nothing left to
     prune by hand.

     Archivo is now the UI face for the whole app, not just /sell. It was the
     seller site's only typeface — it replaced Libre Caslon Text there — and it
     has taken over from Manrope everywhere else too, so one grotesque carries
     the storefront, all three consoles and /sell.

     It is asked for as a VARIABLE font for two reasons. /sell drives its wdth
     axis continuously, and that axis is that site's entire typographic
     hierarchy: column heads squeezed to 78, amounts opened to 112, the way a
     printed form is set. Naming static weights would fetch several files and
     lose the one axis that is the point of choosing it. The rest of the app
     drives only wght, and gets 100–900 out of the same file it was already
     downloading. Roman only — nothing sets Archivo italic.

     TWO FAMILIES, DOWN FROM FOUR. Manrope went with the body face and IBM Plex
     Mono with the last of the labels: the nine remaining codes (coupon code,
     order id, expense reference, hex field) are set in Archivo with tabular
     figures by `.agx-code` in index.css, because what a code needs is digits
     of one width, not a typewriter. Manrope was five named weights and Plex
     two, so this request loses seven static font files and keeps two variable
     ones. A browser downloads nothing until text actually renders in a family,
     so that saving is real on every cold load. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  media="print"
  onload="this.media='all';this.onload=null"
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Archivo:wdth,wght@62..125,100..900&display=swap"
/>
<!-- Icon font stays on `display=block`: with `swap` the browser would paint the
     ligature source text first, so every icon would flash the literal word
     "storefront" or "shopping_bag" before resolving. -->
<link
  rel="stylesheet"
  media="print"
  onload="this.media='all';this.onload=null"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
/>
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet" />
</noscript>
<!-- ── First paint ──────────────────────────────────────────────────────────
     Everything below renders from HTML alone, before a single byte of the app
     bundle has run. It exists because on a 3G connection — the normal case for
     this marketplace's audience — the page was a blank white screen for 7.4
     seconds and unusable for 14.8, with no logo and no motion to say the site
     was alive. Now the brand lands as soon as the HTML does. Styles are inline
     and the wordmark is TEXT, not an image: the 93 kB PNG logo cost ~2 s of the
     very wait this is meant to cover, so the splash needs exactly zero network
     requests and paints with the HTML.

     It has two faces, chosen by the tiny gate script at the end of <head>:

     QUIET (default) — wordmark + ring on the page ground. Removes itself the
     moment React paints, via #root:not(:empty) — no JS, no timer, no flash.
     This is what every console, every auth screen, every repeat load and every
     reduced-motion visitor gets.

     PRELOADER (`html.ag-pre`) — the first page of a storefront visit only
     (set 2026-11-13, modelled on Tubik's SPYLT preloader: dark panel, the
     wordmark "writes itself on" letter by letter with a coloured leading edge
     that cools to cream, a percentage that tracks real boot progress, then the
     panel dissolves into the page). It holds for at least 2.2 s so the
     write-on completes, dismisses the instant the app has mounted after that,
     and gives up at 4 s regardless — nobody on slow 3G waits behind a brand
     moment. The gate skips it when the path is a seller/admin/auth surface,
     when it has already played this session, under prefers-reduced-motion and
     under Save-Data. The panel is the dark-theme ground in BOTH themes, on
     purpose: the reference's whole effect is a dark curtain lifting onto the
     page. Colours here are literal because index.css has not loaded yet and
     the `--ag-*` tokens do not exist at this point; they are copied from it
     (page grounds, --ag-crimson dark, and the gold from the logo's "Mart").

     The admin segment is substituted into the gate at build time by Vite's
     HTML env replacement (the VITE_ADMIN_PATH variable, written between
     percent signs) so the gate can leave the console alone; that path is
     already inlined in the JS bundle, so this adds nothing a devtools search
     would not find — see the obscurity note in src/lib/adminPath.ts. -->
<style>
  #ag-boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#FBF6F2;
    transition:opacity .35s ease}
  html[data-theme="dark"] #ag-boot{background:#120A0E}
  /* Georgia paints instantly; Fraunces swaps in when the webfont lands. The
     family is spelled out rather than using `var(--ag-display)` because this
     splash must paint from the HTML alone — index.css has not loaded yet, so
     the custom property does not exist and the rule would fall back to the
     initial value with no serif at all. */
  #ag-boot .ag-boot-mark{font-family:'Fraunces',Georgia,'Times New Roman',serif;
    font-size:38px;font-weight:700;letter-spacing:-.5px;color:#B02454;line-height:1}
  html[data-theme="dark"] #ag-boot .ag-boot-mark{color:#E85088}
  #ag-boot .ag-boot-ring{width:26px;height:26px;border-radius:50%;
    border:2.5px solid #F0D8E2;border-top-color:#B02454;
    animation:ag-boot-spin .8s linear infinite}
  html[data-theme="dark"] #ag-boot .ag-boot-ring{border-color:#3A2730;border-top-color:#E85088}
  @keyframes ag-boot-spin{to{transform:rotate(360deg)}}
  /* The app has mounted — retire the splash.

     `~` and not `+`. The edge injects its crawlable <noscript> body directly
     before #ag-boot (see the prerender block in middleware.js), and <noscript>
     is a real element node even when scripting is on — so with `+` the splash
     stopped being #root's NEXT sibling and the rule silently stopped matching.
     Every prerendered page then sat under a full-screen spinner forever, with
     the app mounted and painted underneath it at z-index 9999.

     The general sibling combinator matches wherever #ag-boot sits after #root,
     so nothing that gets injected between the two can break it again. */
  #root:not(:empty)~#ag-boot{opacity:0;pointer-events:none;visibility:hidden}
  @media (prefers-reduced-motion:reduce){
    #ag-boot .ag-boot-ring{animation-duration:2s}
    #ag-boot{transition:none}
  }

  /* ── Preloader face ─────────────────────────────────────────────────── */
  #ag-boot .ag-pre{display:none}
  html.ag-pre #ag-boot{background:#120A0E;gap:0;transition:opacity .55s cubic-bezier(.4,0,.2,1)}
  html.ag-pre #ag-boot .ag-boot-mark,html.ag-pre #ag-boot .ag-boot-ring{display:none}
  html.ag-pre #ag-boot .ag-pre{display:block}
  /* React mounting must NOT retire this face — the script does, on its own
     clock. Specificity (2,3,1) beats the retire rule's (2,1,0); `.ag-pre-out`
     hands control back so the same rule then fades it. */
  html.ag-pre #root:not(:empty)~#ag-boot:not(.ag-pre-out){opacity:1;visibility:visible;pointer-events:auto}
  html.ag-pre #ag-boot.ag-pre-out{opacity:0;pointer-events:none}
  html.ag-pre #ag-boot.ag-pre-out .ag-pre-mark{transform:translateY(-8px)}
  .ag-pre-mark{display:block;font-family:'Fraunces',Georgia,'Times New Roman',serif;
    font-size:clamp(42px,10.5vw,96px);font-weight:700;line-height:1.1;letter-spacing:-.025em;
    white-space:nowrap;text-align:center;transition:transform .55s cubic-bezier(.4,0,.2,1)}
  /* Each letter is painted by a gradient clipped to its glyph: cream, then a
     narrow band of the brand colour, then nothing. The gradient starts parked
     to the right so the glyph shows the "nothing" third; sliding it left pulls
     the coloured edge across the letter first and the cream in behind it —
     ink laid by a brush, cooling as it dries. "Mangai" leads with the brand
     rose and "Mart" with the logo's gold, as the lockup itself is coloured. */
  .ag-pre-mark span{display:inline-block;color:transparent;
    background-image:linear-gradient(100deg,#FBF6F2 0%,#FBF6F2 38%,var(--edge) 43%,var(--edge) 50%,transparent 57%,transparent 100%);
    background-size:300% 100%;background-position:100% 0;background-repeat:no-repeat;
    -webkit-background-clip:text;background-clip:text}
  .ag-pre-mark .ag-pre-w1 span{--edge:#E85088}
  .ag-pre-mark .ag-pre-w2 span{--edge:#D9A441}
  html.ag-pre-go .ag-pre-mark span{animation:ag-pre-ink .6s cubic-bezier(.45,0,.2,1) both;
    animation-delay:calc(var(--i) * 95ms)}
  @keyframes ag-pre-ink{to{background-position:0% 0}}
  .ag-pre-meter{position:absolute;left:0;right:0;bottom:max(44px,calc(env(safe-area-inset-bottom) + 36px));
    display:flex;flex-direction:column;align-items:center;gap:9px;
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12px;font-weight:500;
    letter-spacing:.14em;color:#F7ECF0;font-variant-numeric:tabular-nums}
  .ag-pre-line{width:88px;height:1px;background:rgba(247,236,240,.22);overflow:hidden}
  .ag-pre-fill{height:100%;width:0;background:#F7ECF0;transition:width .18s linear}
</style>
<!-- The gate. Runs before <body> so the right face paints first — deciding
     after first paint would flash cream, then dark. Nothing here can throw
     past the try: a failure simply leaves the quiet splash in charge. -->
<script>try{(function(){
  var p=location.pathname,a='%VITE_ADMIN_PATH%';if(a.charAt(0)==='%')a='admin';
  var op=p==='/'+a||p.indexOf('/'+a+'/')===0||p.indexOf('/seller')===0||p.indexOf('/sell')===0||p.indexOf('/auth')===0;
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sd=navigator.connection&&navigator.connection.saveData;
  if(op||rm||sd||sessionStorage.getItem('ag-pre-seen'))return;
  sessionStorage.setItem('ag-pre-seen','1');
  document.documentElement.classList.add('ag-pre');
})()}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<div id="ag-boot" role="status" aria-live="polite">
  <span class="ag-boot-mark">MangaiMart</span>
  <span class="ag-boot-ring" aria-hidden="true"></span>
  <div class="ag-pre">
    <span class="ag-pre-mark" role="img" aria-label="MangaiMart"><span class="ag-pre-w1" aria-hidden="true"><span style="--i:0">M</span><span style="--i:1">a</span><span style="--i:2">n</span><span style="--i:3">g</span><span style="--i:4">a</span><span style="--i:5">i</span></span><span class="ag-pre-w2" aria-hidden="true"><span style="--i:6">M</span><span style="--i:7">a</span><span style="--i:8">r</span><span style="--i:9">t</span></span></span>
    <div class="ag-pre-meter" aria-hidden="true">
      <span class="ag-pre-pct">0 %</span>
      <div class="ag-pre-line"><div class="ag-pre-fill"></div></div>
    </div>
  </div>
  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading MangaiMart…</span>
</div>
<!-- Preloader clock. Only does anything under `html.ag-pre`. The percentage
     is anchored to real milestones — fonts in, bundle executed (DOMContentLoaded
     fires after module scripts run), React mounted (#root gains a child) — and
     glides toward the current one so it is always moving and never lies about
     being done. Dismissal is the latest of: app mounted, 2.2 s elapsed, the
     write-on finished; and never later than 4 s. If anything in here throws,
     the class comes off and the quiet splash's CSS rule takes over. -->
<script>(function(){
  var h=document.documentElement;if(!h.classList.contains('ag-pre'))return;
  try{
    var boot=document.getElementById('ag-boot'),pct=boot.querySelector('.ag-pre-pct'),fill=boot.querySelector('.ag-pre-fill');
    var t0=performance.now(),target=14,shown=0,mounted=false,inkStart=0,done=false,raf=0;
    var elapsed=function(){return performance.now()-t0};
    var aim=function(n){if(n>target)target=n};
    var go=function(){if(inkStart)return;inkStart=elapsed();h.classList.add('ag-pre-go');aim(40)};
    // Start writing when Fraunces is in, or at 900 ms with the fallback serif.
    try{document.fonts.load("700 64px 'Fraunces'").then(go,go)}catch(e){}
    setTimeout(go,900);
    document.addEventListener('DOMContentLoaded',function(){aim(72)});
    var root=document.getElementById('root');
    var onMount=function(){mounted=true;aim(100)};
    if(root.childNodes.length)onMount();else new MutationObserver(function(m,o){if(root.childNodes.length){o.disconnect();onMount()}}).observe(root,{childList:true});
    var finish=function(){
      if(done)return;done=true;cancelAnimationFrame(raf);
      pct.textContent='100 %';fill.style.width='100%';
      setTimeout(function(){boot.classList.add('ag-pre-out');
        setTimeout(function(){h.classList.remove('ag-pre','ag-pre-go');if(boot.parentNode)boot.parentNode.removeChild(boot)},620)},300)};
    var tick=function(){
      var e=elapsed(),fast=mounted?99:target,slow=Math.min(fast+15,99);
      // Glide toward the milestone, then creep a little past it: a stalled
      // network must never read as a frozen page.
      if(shown<fast)shown=Math.min(fast,shown+Math.max((fast-shown)*.045,.06));else if(shown<slow)shown+=.025;
      pct.textContent=Math.round(shown)+' %';fill.style.width=shown+'%';
      var inkDone=inkStart&&e-inkStart>=1500;
      if(e>=4000||(mounted&&e>=2200&&inkDone))finish();else raf=requestAnimationFrame(tick)};
    raf=requestAnimationFrame(tick);
  }catch(e){h.classList.remove('ag-pre','ag-pre-go')}
})();</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
